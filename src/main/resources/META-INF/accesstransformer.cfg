# Aura Revealed shows one entity to one viewer through walls, which means flipping the glowing
# flag on that viewer's client alone. Vanilla keeps that flag protected.
public net.minecraft.world.entity.Entity setSharedFlag(IZ)V

# Bank Shot bounces an arrow off a wall. Vanilla decides an arrow is stuck by looking at where it
# ended its tick, so a bounce that lands it back inside geometry has to be able to say otherwise.
public net.minecraft.world.entity.projectile.AbstractArrow inGround

# Shortening an effect in place. The only other way is to take it off and put a shorter one back,
# which fires the removal event: that wiped Bleeding's and Exhausted's bars every time Lightbringer
# ticked, and Beyond Vision's replacement was overwritten because the Added event fires before the
# effect is stored.
public net.minecraft.world.effect.MobEffectInstance duration
